<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شذى الورد | كل روابطنا</title>
<style>
  :root{
    --bg:#faf9f7;
    --ink:#1a1a1a;
    --line:#e4e1da;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Tajawal','Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .logo-wrap{
    margin-bottom:24px;
  }
  .logo-wrap img{
    max-width:260px;
    width:100%;
    height:auto;
  }
  .tagline{
    display:inline-block;
    background:var(--ink);
    color:#fff;
    padding:10px 22px;
    border-radius:30px;
    font-size:15px;
    margin-bottom:28px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.link-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--line);
    border-radius:30px;
    padding:16px 22px;
    text-decoration:none;
    color:var(--ink);
    font-size:16px;
    font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.link-btn:active{transform:scale(.98);}
  a.link-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .icon{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:16px;
  }
  .ic-map{background:transparent;padding:0;}
  .ic-map svg{width:32px;height:32px;}
  .section-title{
    margin:32px 0 14px;
    font-size:20px;
    font-weight:900;
    color:#1a1a1a;
    letter-spacing:0.5px;
  }
  .ic-ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);color:#fff;}
  .ic-sc{background:#fdd835;color:#111;}
  .ic-tt{background:#111;color:#fff;}
  .ic-wa{background:#128c7e;color:#fff;}
  footer{
    margin-top:34px;
    font-size:12px;
    color:#999;
  }
</style>
</head>
